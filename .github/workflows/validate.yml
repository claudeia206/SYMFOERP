name: Validate application

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-and-symfony:
    name: Compose configuration and Symfony image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          umask 077
          {
            printf 'APP_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'SYMFONY_DB_NAME=symfoerp\n'
            printf 'SYMFONY_DB_USER=symfoerp\n'
            printf 'SYMFONY_DB_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'SYMFONY_DB_ROOT_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > .env.docker

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.docker config --quiet

      - name: Validate native installer shell syntax
        run: bash -n bin/install-symfony-local.sh

      - name: Build Symfony application image
        run: docker build --tag symfoerp-symfony:ci --file Dockerfile .

      - name: Check PHP syntax
        run: |
          docker run --rm symfoerp-symfony:ci sh -lc 'find src config public migrations tests -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l'

      - name: Test third-party entity invariants
        run: docker run --rm symfoerp-symfony:ci php tests/third_party_entity_smoke.php

      - name: Test sales quote entity and totals
        run: docker run --rm symfoerp-symfony:ci php tests/sales_quote_entity_smoke.php

      - name: Test sales invoice payment rules
        run: docker run --rm symfoerp-symfony:ci php tests/sales_invoice_entity_smoke.php

      - name: Test partial customer deliveries and stock movements
        run: docker run --rm symfoerp-symfony:ci php tests/sales_delivery_entity_smoke.php

      - name: Test customer returns and stock reintegration
        run: docker run --rm symfoerp-symfony:ci php tests/sales_return_entity_smoke.php

      - name: Test customer credit notes and receivables
        run: docker run --rm symfoerp-symfony:ci php tests/sales_credit_note_entity_smoke.php

      - name: Test bank transaction reconciliation
        run: docker run --rm symfoerp-symfony:ci php tests/bank_transaction_entity_smoke.php
      - name: Test strict bank statement parsing
        run: docker run --rm symfoerp-symfony:ci php tests/bank_statement_value_parser_smoke.php
      - name: Test FEC export formatting invariants
        run: docker run --rm symfoerp-symfony:ci php tests/fec_export_formatter_smoke.php

      - name: Test product catalogue and stock invariants
        run: docker run --rm symfoerp-symfony:ci php tests/product_entity_smoke.php

      - name: Test supplier purchase orders and receipts
        run: docker run --rm symfoerp-symfony:ci php tests/purchase_order_entity_smoke.php

      - name: Test supplier invoice and outgoing payment rules
        run: docker run --rm symfoerp-symfony:ci php tests/supplier_invoice_entity_smoke.php

      - name: Test accounting posting validation
        run: docker run --rm symfoerp-symfony:ci php tests/accounting_posting_validation_smoke.php
      - name: Test strict accounting form dates
        run: docker run --rm symfoerp-symfony:ci php tests/accounting_form_date_smoke.php

      - name: Test accounting fiscal period boundaries
        run: docker run --rm symfoerp-symfony:ci php tests/accounting_period_guard_smoke.php
      - name: Smoke test Symfony HTTP application
        run: |
          set -eu
          docker run --detach --rm --name symfoerp-symfony-smoke -e APP_ENV=dev -e APP_DEBUG=1 -e APP_SECRET=ci-smoke-test-secret -p 127.0.0.1:8000:8000 symfoerp-symfony:ci
          cleanup() {
            docker stop symfoerp-symfony-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8000/login --output /tmp/symfoerp-login.html; then
              grep -q "Connexion" /tmp/symfoerp-login.html
              curl --connect-timeout 2 --max-time 5 --fail --silent --show-error http://127.0.0.1:8000/healthz --output /tmp/symfoerp-health.json
              grep -q '"status":"ok"' /tmp/symfoerp-health.json
              echo "Symfony login page and public health endpoint responded successfully."
              exit 0
            fi
            sleep 2
          done
          docker logs symfoerp-symfony-smoke
          echo "Symfony HTTP smoke test failed." >&2
          exit 1

      - name: Apply migrations and test authenticated third-party access
        run: |
          set -eu
          trap 'echo "=== Symfony and MariaDB container logs (last 300 lines) ==="; docker compose --env-file .env.docker logs --no-color --tail=300 symfony db_symfony || true' ERR
          # Exercise the same first-install path used by developers, not a parallel CI-only sequence.
          printf '%s\n%s\n' 'ci-admin@example.test' 'CI-Only-Password-2026' | bash bin/install-symfony-local.sh
          # Confirm the installer created the account and that all Doctrine mappings are valid.
          # Accounting tables are migration-managed and intentionally not all ORM-mapped.
          set -a
          . ./.env.docker
          set +a
          symfoerp_network="$(docker inspect --format '{{range $name, $network := .NetworkSettings.Networks}}{{printf "%s" $name}}{{end}}' symfoerp-symfony)"
          symfoerp_image="$(docker inspect --format '{{.Image}}' symfoerp-symfony)"
          symfoerp_database_url="mysql://${SYMFONY_DB_USER}:${SYMFONY_DB_PASSWORD}@db_symfony:3306/${SYMFONY_DB_NAME}?serverVersion=mariadb-11.4.2&charset=utf8mb4"
          docker run --rm --network "$symfoerp_network" -e APP_ENV=dev -e APP_DEBUG=1 -e APP_SECRET="$APP_SECRET" -e DATABASE_URL="$symfoerp_database_url" "$symfoerp_image" php /app/bin/console doctrine:schema:validate --skip-sync
          python3 - <<'PY'
          import http.cookiejar
          import urllib.parse
          import urllib.request
          import re
          from html.parser import HTMLParser

          base = "http://127.0.0.1:8000"
          class TokenParser(HTMLParser):
              token = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "input" and values.get("name") in ("_csrf_token", "_token"):
                      self.token = values.get("value")

          cookies = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookies))
          protected = client.open(base + "/third-parties")
          assert protected.geturl().endswith("/login"), "Unauthenticated request was not redirected to login"
          login_page = client.open(base + "/login").read().decode()
          parser = TokenParser()
          parser.feed(login_page)
          assert parser.token, "Login CSRF token is missing"
          payload = urllib.parse.urlencode({"email": "ci-admin@example.test", "password": "CI-Only-Password-2026", "_csrf_token": parser.token}).encode()
          client.open(urllib.request.Request(base + "/login", data=payload)).read()
          registry = client.open(base + "/third-parties")
          html = registry.read().decode()
          assert registry.geturl().endswith("/third-parties"), "Authenticated user could not access third parties"
          assert "Aucun tiers enregistré dans Symfony" in html, "Empty third-party registry did not render"
          logout_parser = TokenParser()
          logout_parser.feed(html)
          assert logout_parser.token, "Logout CSRF token is missing"
          logout_payload = urllib.parse.urlencode({"_csrf_token": logout_parser.token}).encode()
          client.open(urllib.request.Request(base + "/logout", data=logout_payload)).read()
          after_logout = client.open(base + "/third-parties")
          assert after_logout.geturl().endswith("/login"), "Logout did not invalidate the authenticated session"
          relogin_page = client.open(base + "/login").read().decode()
          relogin_parser = TokenParser()
          relogin_parser.feed(relogin_page)
          relogin_payload = urllib.parse.urlencode({"email": "ci-admin@example.test", "password": "CI-Only-Password-2026", "_csrf_token": relogin_parser.token}).encode()
          client.open(urllib.request.Request(base + "/login", data=relogin_payload)).read()

          # Verify administrator-only user management, account creation and role changes.
          admin_page = client.open(base + "/admin/users")
          admin_html = admin_page.read().decode()
          assert "Utilisateurs et rôles" in admin_html, "Administrator user management page did not render"
          assert "ci-admin@example.test" in admin_html, "Initial administrator is missing from user management"
          assert 'href="/admin/users/new"' in admin_html, "User creation link is missing"
          new_user_page = client.open(base + "/admin/users/new").read().decode()
          new_user_parser = TokenParser()
          new_user_parser.feed(new_user_page)
          assert new_user_parser.token, "User creation CSRF token is missing"
          new_user_payload = urllib.parse.urlencode({
              "_token": new_user_parser.token,
              "email": "ci-user@example.test",
              "password": "CI-Only-User-Password-2026",
          }).encode()
          created_user_response = client.open(urllib.request.Request(base + "/admin/users/new", data=new_user_payload))
          assert created_user_response.geturl().endswith("/admin/users"), "Administrator could not create a standard user"
          users_after_create = created_user_response.read().decode()
          assert "ci-user@example.test" in users_after_create, "New user is missing from the user list"
          user_row = re.search(r'<tr>.*?ci-user@example.test.*?</tr>', users_after_create, re.S)
          assert user_row, "Created standard user row is missing"
          role_form = re.search(r'<form method="post" action="/admin/users/([0-9]+)/role"[^>]*>.*?</form>', user_row.group(0), re.S)
          assert role_form, "User role management form is missing"
          role_token = re.search(r'name="_token" value="([^"]+)"', role_form.group(0))
          assert role_token, "User role management CSRF token is missing"
          promoted_response = client.open(urllib.request.Request(
              base + "/admin/users/" + role_form.group(1) + "/role",
              data=urllib.parse.urlencode({"_token": role_token.group(1), "is_admin": "1"}).encode(),
          ))
          promoted_html = promoted_response.read().decode()
          promoted_row = re.search(r'<tr>.*?ci-user@example.test.*?</tr>', promoted_html, re.S)
          assert promoted_row and "Administrateur" in promoted_row.group(0), "Promoting a user to administrator did not persist"
          print("Administrator-only user management, user creation and role promotion passed.")

          sales_page = client.open(base + "/sales/quotes")
          sales_html = sales_page.read().decode()
          assert "Devis" in sales_html, "Authenticated user could not open the sales quotes module"
          report_html = client.open(base + "/reports/finance").read().decode()
          assert "Reporting financier" in report_html, "Authenticated user could not open financial reporting"
          bank_html = client.open(base + "/finance/bank").read().decode()
          assert "Rapprochement bancaire" in bank_html, "Authenticated user could not open bank reconciliation"
          cash_flow_html = client.open(base + "/reports/cash-flow").read().decode()
          assert "Prévision de trésorerie" in cash_flow_html, "Authenticated user could not open cash flow forecast"
          ledger_html = client.open(base + "/accounting").read().decode()
          assert "Comptabilité générale" in ledger_html, "Authenticated user could not open general ledger"
          vat_html = client.open(base + "/accounting/vat").read().decode()
          assert "Préparation de la déclaration de TVA" in vat_html, "Authenticated user could not open VAT declaration report"
          aging_html = client.open(base + "/accounting/aging").read().decode()
          assert "Balance âgée clients et fournisseurs" in aging_html, "Authenticated user could not open receivables and payables aging report"
          vat_csv = client.open(base + "/accounting/vat/export.csv").read()
          assert b"TVA collect" in vat_csv, "VAT CSV export did not return its expected headers"
          settings_page = client.open(base + "/settings/company").read().decode()
          settings_parser = TokenParser()
          settings_parser.feed(settings_page)
          assert settings_parser.token, "Company settings CSRF token is missing"
          client.open(urllib.request.Request(base + "/settings/company", data=urllib.parse.urlencode({
              "legalName": "Société CI", "address": "1 rue du Test", "postalCode": "17000",
              "city": "La Rochelle", "country": "France", "siren": "123456789",
              "siret": "12345678900012", "paymentTerms": "Paiement à 30 jours",
              "latePenaltyRate": "Taux légal applicable", "recoveryFee": "40.00",
              "vatRegimeNote": "TVA selon régime applicable", "paymentDelayDays": "30",
              "_token": settings_parser.token,
          }).encode()))
          quote_form = client.open(base + "/sales/quotes/new").read().decode()
          assert "Nouveau devis" in quote_form, "Sales quote creation form did not render"
          third_party_form = client.open(base + "/third-parties/new").read().decode()
          third_party_parser = TokenParser()
          third_party_parser.feed(third_party_form)
          assert third_party_parser.token, "Third-party creation CSRF token is missing"
          client.open(urllib.request.Request(base + "/third-parties/new", data=urllib.parse.urlencode({
              "name": "Client CI",
              "category": "customer",
              "email": "client-ci@example.test",
              "phone": "",
              "address": "2 rue Client", "postal_code": "17000", "city": "La Rochelle", "country": "France",
              "_token": third_party_parser.token,
          }).encode()))
          quote_form = client.open(base + "/sales/quotes/new").read().decode()
          quote_parser = TokenParser()
          quote_parser.feed(quote_form)
          assert quote_parser.token, "Sales quote creation CSRF token is missing"
          import re
          from datetime import date, timedelta
          customer_match = re.search(r'<option value="(\d+)"[^>]*>Client CI</option>', quote_form)
          assert customer_match, "New customer was not available in the quote form"
          statement_html = client.open(base + "/third-parties/" + customer_match.group(1) + "/account-statement").read().decode()
          assert "Relevé de compte client" in statement_html, "Customer account statement did not render"
          statement_pdf = client.open(base + "/third-parties/" + customer_match.group(1) + "/account-statement/pdf")
          assert statement_pdf.headers.get_content_type() == "application/pdf", "Customer account statement PDF returned the wrong content type"
          assert statement_pdf.read().startswith(b"%PDF-"), "Customer account statement PDF is invalid"
          quote_payload = {
              "customer_id": customer_match.group(1),
              "valid_until": (date.today() + timedelta(days=30)).isoformat(),
              "notes": "Created by CI",
              "_token": quote_parser.token,
              "lines[0][description]": "Prestation de test",
              "lines[0][quantity]": "2",
              "lines[0][unit_price]": "50.00",
              "lines[0][vat_rate]": "20.00",
          }
          quote_response = client.open(urllib.request.Request(base + "/sales/quotes/new", data=urllib.parse.urlencode(quote_payload).encode()))
          quote_html = quote_response.read().decode()
          assert "DEV-" in quote_html, "Created quote number was not displayed"
          assert "120,00 €" in quote_html, "Quote total including VAT is incorrect"
          quote_parser = TokenParser()
          quote_parser.feed(quote_html)
          quote_id_match = re.search(r"/sales/quotes/(\d+)", quote_response.geturl())
          assert quote_id_match, "Created quote detail URL is invalid"
          status_payload = urllib.parse.urlencode({"_token": quote_parser.token, "status": "sent"}).encode()
          sent_response = client.open(urllib.request.Request(base + "/sales/quotes/" + quote_id_match.group(1) + "/status", data=status_payload))
          sent_html = sent_response.read().decode()
          assert "Envoyé" in sent_html, "Quote status transition to sent failed"
          sent_parser = TokenParser()
          sent_parser.feed(sent_html)
          accepted_payload = urllib.parse.urlencode({"_token": sent_parser.token, "status": "accepted"}).encode()
          accepted_response = client.open(urllib.request.Request(base + "/sales/quotes/" + quote_id_match.group(1) + "/status", data=accepted_payload))
          accepted_html = accepted_response.read().decode()
          assert "Accepté" in accepted_html, "Quote status transition to accepted failed"
          accepted_parser = TokenParser()
          accepted_parser.feed(accepted_html)
          convert_payload = urllib.parse.urlencode({"_token": accepted_parser.token}).encode()
          order_response = client.open(urllib.request.Request(base + "/sales/quotes/" + quote_id_match.group(1) + "/convert", data=convert_payload))
          order_html = order_response.read().decode()
          assert "CMD-" in order_html, "Accepted quote was not converted to a sales order"
          assert "120,00 €" in order_html, "Sales order totals do not match the source quote"
          first_order_url = order_response.geturl()
          duplicate_response = client.open(urllib.request.Request(base + "/sales/quotes/" + quote_id_match.group(1) + "/convert", data=convert_payload))
          assert duplicate_response.geturl() == first_order_url, "Repeated quote conversion created a different order"
          order_parser = TokenParser()
          order_parser.feed(order_html)
          order_id_match = re.search(r"/sales/orders/(\d+)", first_order_url)
          assert order_id_match, "Created order detail URL is invalid"
          fulfil_payload = urllib.parse.urlencode({"_token": order_parser.token, "status": "fulfilled"}).encode()
          fulfil_response = client.open(urllib.request.Request(base + "/sales/orders/" + order_id_match.group(1) + "/status", data=fulfil_payload))
          fulfil_html = fulfil_response.read().decode()
          assert "Terminée" in fulfil_html, "Sales order status transition to fulfilled failed"
          pdf_response = client.open(base + "/sales/quotes/" + quote_id_match.group(1) + "/pdf")
          pdf_content = pdf_response.read()
          assert pdf_response.headers.get_content_type() == "application/pdf", "Quote PDF route returned the wrong content type"
          assert pdf_content.startswith(b"%PDF-"), "Quote PDF route did not return a valid PDF document"
          order_id = order_id_match.group(1)
          invoice_create_token = re.search(r'<form method="post" action="/sales/invoices/from-order/\d+">.*?name="_token" value="([^"]+)"', fulfil_html, re.S)
          assert invoice_create_token, "Invoice creation CSRF token is missing"
          invoice_create_response = client.open(urllib.request.Request(base + "/sales/invoices/from-order/" + order_id, data=urllib.parse.urlencode({
              "_token": invoice_create_token.group(1),
          }).encode()))
          invoice_html = invoice_create_response.read().decode()
          assert "Facture brouillon" in invoice_html, "Invoice draft was not created from the order"
          invoice_id_match = re.search(r"/sales/invoices/(\d+)", invoice_create_response.geturl())
          assert invoice_id_match, "Invoice detail URL is invalid"
          invoice_parser = TokenParser()
          invoice_parser.feed(invoice_html)
          issue_response = client.open(urllib.request.Request(base + "/sales/invoices/" + invoice_id_match.group(1) + "/issue", data=urllib.parse.urlencode({
              "_token": invoice_parser.token,
          }).encode()))
          issued_html = issue_response.read().decode()
          assert "FAC-" in issued_html, "Invoice was not issued with a final number"
          invoice_pdf = client.open(base + "/sales/invoices/" + invoice_id_match.group(1) + "/pdf")
          invoice_pdf_content = invoice_pdf.read()
          assert invoice_pdf.headers.get_content_type() == "application/pdf", "Invoice PDF route returned the wrong content type"
          assert invoice_pdf_content.startswith(b"%PDF-"), "Invoice PDF route did not return a valid PDF"
          payment_token = re.search(r'<form method="post" action="/sales/invoices/' + invoice_id_match.group(1) + r'/payments">.*?name="_token" value="([^"]+)"', issued_html, re.S)
          assert payment_token, "Customer payment form token is missing after invoice issue"
          payment_response = client.open(urllib.request.Request(base + "/sales/invoices/" + invoice_id_match.group(1) + "/payments", data=urllib.parse.urlencode({
              "_token": payment_token.group(1), "amount": "20.00", "paid_at": date.today().isoformat(),
              "method": "bank_transfer", "reference": "CI-VIR-001",
          }).encode()))
          payment_html = payment_response.read().decode()
          assert "enregistré et comptabilisé" in payment_html, "Customer payment was not automatically posted"
          credit_form = re.search(r'<form method="post" action="/sales/invoices/' + invoice_id_match.group(1) + r'/credit-notes">.*?</form>', payment_html, re.S)
          assert credit_form, "Customer credit note form is missing"
          credit_token = re.search(r'name="_token" value="([^"]+)"', credit_form.group(0))
          credit_line = re.search(r'name="quantities\[(\d+)\]"', credit_form.group(0))
          assert credit_token and credit_line, "Customer credit note fields are missing"
          credit_response = client.open(urllib.request.Request(base + "/sales/invoices/" + invoice_id_match.group(1) + "/credit-notes", data=urllib.parse.urlencode({
              "_token": credit_token.group(1), "reason": "CI automatic accounting posting", "quantities[" + credit_line.group(1) + "]": "0.500",
          }).encode()))
          credit_html = credit_response.read().decode()
          assert "a été émis et comptabilisé" in credit_html, "Customer credit note was not automatically posted"
          ledger_after_sales = client.open(base + "/accounting").read().decode()
          assert "Facture client FAC-" in ledger_after_sales, "Issued sales invoice accounting entry is missing"
          assert "Règlement facture FAC-" in ledger_after_sales, "Customer payment accounting entry is missing"
          assert "Avoir client AV-" in ledger_after_sales, "Customer credit note accounting entry is missing"
          supplier_form = client.open(base + "/third-parties/new").read().decode()
          supplier_parser = TokenParser()
          supplier_parser.feed(supplier_form)
          client.open(urllib.request.Request(base + "/third-parties/new", data=urllib.parse.urlencode({
              "name": "Fournisseur CI", "category": "supplier", "email": "fournisseur-ci@example.test",
              "phone": "", "address": "3 rue Fournisseur", "postal_code": "17000",
              "city": "La Rochelle", "country": "France", "_token": supplier_parser.token,
          }).encode()))
          product_form = client.open(base + "/products/new").read().decode()
          product_parser = TokenParser()
          product_parser.feed(product_form)
          client.open(urllib.request.Request(base + "/products/new", data=urllib.parse.urlencode({
              "sku": "CI-ACH-001", "name": "Produit achat CI", "unit": "pièce",
              "purchase_price": "50.00", "sale_price": "80.00", "vat_rate": "20.00",
              "stock_alert_threshold": "0", "stock_tracked": "1", "active": "1",
              "_token": product_parser.token,
          }).encode()))
          purchase_form = client.open(base + "/purchases/new").read().decode()
          purchase_parser = TokenParser()
          purchase_parser.feed(purchase_form)
          supplier_match = re.search(r'<option value="(\d+)"[^>]*>Fournisseur CI</option>', purchase_form)
          product_match = re.search(r'<option value="(\d+)"[^>]*>CI-ACH-001', purchase_form)
          assert supplier_match and product_match, "Supplier or product missing from purchase order form"
          purchase_response = client.open(urllib.request.Request(base + "/purchases/new", data=urllib.parse.urlencode({
              "supplier_id": supplier_match.group(1), "notes": "CI purchase",
              "_token": purchase_parser.token, "lines[0][product_id]": product_match.group(1),
              "lines[0][quantity]": "2",
          }).encode()))
          purchase_html = purchase_response.read().decode()
          purchase_id = re.search(r"/purchases/(\d+)", purchase_response.geturl())
          assert purchase_id, "Purchase order was not created"
          purchase_parser = TokenParser()
          purchase_parser.feed(purchase_html)
          receive_token = re.search(r'<form method="post" action="/purchases/' + purchase_id.group(1) + r'/receive"[^>]*>.*?name="_token" value="([^"]+)"', purchase_html, re.S)
          assert receive_token, "Purchase receipt CSRF token missing"
          received_line = re.search(r'name="received\[(\d+)\]"', purchase_html)
          assert received_line, "Purchase order receipt quantity input missing"
          received_html = client.open(urllib.request.Request(base + "/purchases/" + purchase_id.group(1) + "/receive", data=urllib.parse.urlencode({
              "_token": receive_token.group(1), "received[" + received_line.group(1) + "]": "2",
          }).encode())).read().decode()
          assert "Réceptionnée" in received_html and "2.000" in received_html, "Purchase order receipt did not persist the received quantity and final status"
          supplier_invoice_index = client.open(base + "/purchases/invoices").read().decode()
          create_supplier_form = re.search(r'<form method="post" action="/purchases/invoices/from-order/' + purchase_id.group(1) + r'"[^>]*>.*?</form>', supplier_invoice_index, re.S)
          assert create_supplier_form, "Supplier invoice creation form missing after receipt; rendered index excerpt: " + supplier_invoice_index[:5000]
          supplier_invoice_token = re.search(r'name="_token" value="([^"]+)"', create_supplier_form.group(0))
          assert supplier_invoice_token, "Supplier invoice creation CSRF token missing"
          supplier_invoice_html = client.open(urllib.request.Request(base + "/purchases/invoices/from-order/" + purchase_id.group(1), data=urllib.parse.urlencode({
              "_token": supplier_invoice_token.group(1), "supplier_invoice_number": "CI-FOUR-001",
          }).encode())).read().decode()
          supplier_invoice_id = re.search(r'href="/purchases/invoices/(\d+)"', supplier_invoice_html)
          assert supplier_invoice_id, "Supplier invoice draft was not created"
          supplier_detail = client.open(base + "/purchases/invoices/" + supplier_invoice_id.group(1)).read().decode()
          supplier_receive_form = re.search(r'<form method="post" action="/purchases/invoices/' + supplier_invoice_id.group(1) + r'/receive"[^>]*>.*?</form>', supplier_detail, re.S)
          assert supplier_receive_form, "Supplier invoice validation form missing"
          supplier_receive_token = re.search(r'name="_token" value="([^"]+)"', supplier_receive_form.group(0))
          assert supplier_receive_token, "Supplier invoice validation CSRF token missing"
          supplier_received = client.open(urllib.request.Request(base + "/purchases/invoices/" + supplier_invoice_id.group(1) + "/receive", data=urllib.parse.urlencode({
              "_token": supplier_receive_token.group(1), "invoice_date": date.today().isoformat(),
              "due_date": (date.today() + timedelta(days=30)).isoformat(),
          }).encode())).read().decode()
          assert "validée et comptabilisée" in supplier_received, "Supplier invoice was not automatically posted"
          supplier_payment_form = re.search(r'<form method="post" action="/purchases/invoices/' + supplier_invoice_id.group(1) + r'/payments"[^>]*>.*?</form>', supplier_received, re.S)
          assert supplier_payment_form, "Supplier payment form missing after validation"
          supplier_payment_token = re.search(r'name="_token" value="([^"]+)"', supplier_payment_form.group(0))
          assert supplier_payment_token, "Supplier payment CSRF token missing"
          supplier_paid = client.open(urllib.request.Request(base + "/purchases/invoices/" + supplier_invoice_id.group(1) + "/payments", data=urllib.parse.urlencode({
              "_token": supplier_payment_token.group(1), "amount": "10.00", "paid_at": date.today().isoformat(),
              "method": "bank_transfer", "reference": "CI-ACH-VIR-001",
          }).encode())).read().decode()
          assert "enregistré et comptabilisé" in supplier_paid, "Supplier payment was not automatically posted"
          ledger_after_purchases = client.open(base + "/accounting").read().decode()
          assert "Facture fournisseur CI-FOUR-001" in ledger_after_purchases, "Supplier invoice accounting entry is missing"
          assert "Règlement fournisseur CI-FOUR-001" in ledger_after_purchases, "Supplier payment accounting entry is missing"
          print("Automatic general ledger postings for supplier invoices and payments passed.")
          print("Automatic general ledger postings for sales invoices, payments and credit notes passed.")
          print("Symfony authentication, third-party registry, quote creation, VAT totals, acceptance, idempotent order conversion, order completion and PDF export passed.")
