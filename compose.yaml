services:
  symfony:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfoerp-symfony
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.docker}
      DATABASE_URL: "mysql://${SYMFONY_DB_USER}:${SYMFONY_DB_PASSWORD}@db_symfony:3306/${SYMFONY_DB_NAME}?serverVersion=mariadb-11.4.2&charset=utf8mb4"
    depends_on:
      db_symfony:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/healthz') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - symfony_var:/app/var
    networks:
      - symfony_net

  db_symfony:
    image: mariadb:11.4
    container_name: symfoerp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${SYMFONY_DB_NAME}
      MARIADB_USER: ${SYMFONY_DB_USER}
      MARIADB_PASSWORD: ${SYMFONY_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SYMFONY_DB_ROOT_PASSWORD}
    volumes:
      - symfony_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - symfony_net

volumes:
  symfony_var:
  symfony_database:

networks:
  symfony_net:
